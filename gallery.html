<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<!-- IMPORTANT for Mobile -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Projects & Gallery</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f4f4;
}

/* Header */
.header{
    background:#eb0505;
    color:rgb(68, 210, 21);
    padding:20px;
    text-align:center;
}

/* Container */
.container{
    width:90%;
    max-width:1200px;
    margin:30px auto;
}

/* Gallery Grid (Already Responsive) */
.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
    gap:20px;
}

/* Photo Box */
.photo-box{
    background:white;
    border-radius:8px;
    overflow:hidden;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
    transition:0.22em;
}

.photo-box:hover{
    transform:translateY(-5px);
}

/* Image */
.photo-box img{
    width:100%;
    height:160px;
    object-fit:cover;
    background:#ddd;
}

/* Title */
.photo-title{
    padding:10px;
    text-align:center;
    font-weight:bold;
    background:#004aad;
    color:white;
}
</style>
</head>

<body>

<div class="header">

</div>
