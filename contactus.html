<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Contact Us | RN Concrete Udyog</title>

<style>
body{
    margin:0;
    font-family: Arial, sans-serif;
    background:#f4f4f4;
}

/* Header */
.header{
    background:#b5d005;
    color:rgb(236, 13, 13);
    padding:20px;
    text-align:center;
}

/* Main container */
.container{
    width:90%;
    max-width:1000px;
    margin:30px auto;
    background:white;
    padding:20px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

/* Contact boxes */
.contact-info{
    display:flex;
    flex-wrap:wrap;
    gap:20px;
}

.box{
    flex:1;
    min-width:250px;
    background:#e9e9e9;
    padding:15px;
    border-left:5px solid #004aad;
}

.box h3{
    margin-top:0;
    color:#004aad;
}

/* Direct Call Button */
.call-btn{
    display:inline-block;
    margin-top:10px;
    background:green;
    color:white;
    padding:10px 20px;
    text-decoration:none;
    border-radius:5px;
    font-weight:bold;
}

.call-btn:hover{
    background:darkgreen;
}

/* Form */
form{
    margin-top:30px;
}

input, textarea{
    width:100%;
    padding:10px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:5px;
}

button{
    background:#004aad;
    color:white;
    border:none;
    padding:10px 20px;
    cursor:pointer;
    border-radius:5px;
    font-size:16px;
}

button:hover{
    background:#003080;
}

/* Map */
.map{
    margin-top:30px;
}
</style>
</head>

<body>

<div class="header">
    <h3>Contact Us</h3>
    <h1>RN Concrete Udyog</h1>
</div>

<div class="container">

    <div class="contact-info">

        <!-- Address -->
        <div class="box">
            <h3>📍 Address</h3>
            <p>
                RN Concrete Udyog<br>
                chakdiharam hulaseebir gangapur Varanasi, Varanasi<br>
                Uttar Pradesh, India
            </p>
        </div>

        <!-- Phone with Direct Call -->
        <div class="box">
            <h3>📞 Phone</h3>
            <p>+91 97926 66066</p>
            <a href="tel:97926 66066" class="call-btn">📞 Call Now</a>
        </div>

        <!-- WhatsApp -->
        <div class="box">
            <h3>💬 WhatsApp</h3>
            <p>
                <a href="https://wa.me/919792666066" target="_blank">
                    Chat on WhatsApp
                </a>
            </p>
        </div>

    </div>

    <!-- Enquiry Form -->
    <h2 style="margin-top:40px;color:#004aad;">Enquiry Form</h2>

    <form>
        <input type="text" placeholder="Your Name" required>
        <input type="tel" placeholder="Phone Number" required>
        <input type="email" placeholder="Email Address">
        <textarea rows="5" placeholder="Your Message"></textarea>
        <button type="submit">Send Enquiry</button>
    </form>

    <!-- Google Map -->
    <div class="map">
        <h2 style="color:#004aad;">📍 Our Location</h2>
        <iframe 
            src="https://www.google.com/maps?q=Varanasi&output=embed"
            width="100%" 
            height="300" 
            style="border:0;"
            allowfullscreen
            loading="lazy">
        </iframe>
    </div>

</div>

</body>
</html>
